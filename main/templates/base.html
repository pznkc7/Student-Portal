<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Leave Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/74241ca4bb.js" crossorigin="anonymous"></script>

    <!-- Alertify -->
        <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css"/>

        <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/themes/default.min.css"/>

        <script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js"></script>

    <style>

        body{
            background:#f4f7fc;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar{
            background:#0d6efd !important;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        .navbar-brand{
            font-weight:700;
            color:white !important;
        }

        .nav-link{
            color:white !important;
            border-radius:8px;
            padding:8px 12px !important;
            transition:.3s;
        }

        .nav-link:hover{
            background:rgba(255,255,255,.15);
        }

        .activeNav{
            background:rgba(255,255,255,.25);
        }

        .user-badge{
            color:white;
            font-weight:500;
        }

        .main-content{
            padding:30px 0;
        }

        .search-box select,
        .search-box input{
            border-radius:8px;
        }

    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="{% url 'home' %}">
            <i class="fa-solid fa-graduation-cap"></i>
            Student Portal
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}activeNav{% endif %}"
                       href="{% url 'home' %}">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/form/' %}activeNav{% endif %}"
                       href="{% url 'form' %}">
                        Submit Leave
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/contact/' %}activeNav{% endif %}"
                       href="{% url 'contact' %}">
                        Contact
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/about/' %}activeNav{% endif %}"
                       href="{% url 'about' %}">
                        About
                    </a>
                </li>

            </ul>

            {% if user.is_authenticated %}

            <div class="d-flex align-items-center gap-3">

                <span class="user-badge">
                    <i class="fa-solid fa-user"></i>
                    {{ user.username }}
                </span>

                <a href="{% url 'user_profile' %}"
                   class="btn btn-light btn-sm">
                    Profile
                </a>

                <a href="{% url 'log_out' %}"
                   class="btn btn-danger btn-sm">
                    Logout
                </a>

            </div>

            {% else %}

            <div class="d-flex gap-2">

                <a href="{% url 'log_in' %}"
                   class="btn btn-light btn-sm">
                    Login
                </a>

                <a href="{% url 'register' %}"
                   class="btn btn-warning btn-sm">
                    Register
                </a>

            </div>

            {% endif %}

        </div>
    </div>
</nav>

<div class="main-content">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

{% if messages %}
    {% for message in messages %}
        <script>
            alertify.set('notifier', 'position', 'bottom-center');

            {% if message.tags == 'error' %}
                alertify.error("{{ message|escapejs }}");
            {% else %}
                alertify.success("{{ message|escapejs }}");
            {% endif %}
        </script>
    {% endfor %}
{% endif %}



</body>
</html>
