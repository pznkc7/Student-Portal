{% extends "base.html" %}
{% load static %}

{% block content %}

<style>
    body{
        background-color:#f4f7fc;
    }

    .auth-wrapper{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .auth-card{
        width:100%;
        max-width:450px;
        background:#fff;
        padding:40px;
        border-radius:15px;
        box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    .heading{
        text-align:center;
        font-size:30px;
        font-weight:700;
        color:#2c3e50;
        margin-bottom:5px;
    }

    .sub-heading{
        text-align:center;
        color:#6c757d;
        margin-bottom:25px;
    }

    .form .input{
        width:100%;
        padding:12px 15px;
        border:1px solid #ced4da;
        border-radius:8px;
        margin-bottom:15px;
        font-size:15px;
        transition:0.3s;
    }

    .form .input:focus{
        outline:none;
        border-color:#0d6efd;
        box-shadow:0 0 5px rgba(13,110,253,.25);
    }

    .remember-section{
        margin-bottom:15px;
    }

    .forgot-password{
        text-align:right;
        margin-bottom:15px;
    }

    .forgot-password a{
        text-decoration:none;
        color:#0d6efd;
    }

    .login-button{
        width:100%;
        border:none;
        background:#0d6efd;
        color:white;
        padding:12px;
        border-radius:8px;
        font-weight:600;
        transition:.3s;
    }

    .login-button:hover{
        background:#0b5ed7;
    }

    .social-account-container{
        margin-top:25px;
        text-align:center;
    }

    .title{
        color:#6c757d;
        font-size:14px;
    }

    .social-accounts{
        display:flex;
        justify-content:center;
        margin-top:10px;
    }

    .social-button{
        width:45px;
        height:45px;
        border:none;
        border-radius:50%;
        background:#f1f3f5;
        cursor:pointer;
    }

    .social-button svg{
        fill:#444;
    }
</style>

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="heading">Student Leave Portal</div>

        <p class="sub-heading">
            Sign in to submit and track leave requests
        </p>

        <form action="{% url 'log_in' %}" method="POST" class="form">
            {% csrf_token %}

            <input
                required
                class="input"
                type="text"
                name="username"
                placeholder="Username">

            <input
                required
                class="input"
                type="password"
                name="password"
                placeholder="Password">

            <div class="remember-section">
                <input type="checkbox" name="remember_me">
                <label>Remember Me</label>
            </div>

            <div class="forgot-password">
                <a href="{% url 'password_reset' %}">
                    Forgot Password?
                </a>
            </div>

            <input
                class="login-button"
                type="submit"
                value="Login">
        </form>

        <div class="social-account-container">

            <span class="title">Or Continue With</span>

            <div class="social-accounts">

                <button
                    class="social-button"
                    onclick="window.location.href='{% url 'social:begin' 'google-oauth2' %}'">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         height="1em"
                         viewBox="0 0 488 512">
                        <path d="M488 261.8C488 403.3 391.1 504 248 504
                        110.8 504 0 393.2 0 256S110.8 8 248 8
                        c66.8 0 123 24.5 166.3 64.9l-67.5 64.9
                        C258.5 52.6 94.3 116.6 94.3 256
                        c0 86.5 69.1 156.6 153.7 156.6
                        98.2 0 135-70.4 140.8-106.9H248v-85.3
                        h236.1c2.3 12.7 3.9 24.9 3.9 41.4z">
                        </path>
                    </svg>

                </button>

            </div>
        </div>

    </div>

</div>

{% endblock content %}
